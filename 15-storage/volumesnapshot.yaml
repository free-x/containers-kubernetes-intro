apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: demo-data-snapshot
# Referenz-Manifest: setzt einen CSI-Treiber mit Snapshot-Support
# sowie eine passende VolumeSnapshotClass im Cluster voraus.
spec:
  volumeSnapshotClassName: csi-snapshot-class
  source:
    persistentVolumeClaimName: demo-data
